services:
  - type: web
    name: mindvision-clinical-backend
    env: node
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DOCTOR_DEFAULT_PASSWORD
        sync: false
